services:
  - type: web
    name: manglara-server
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    # Chromium (~400 MB) no cabe en el plan free: usar starter o self-host.
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: models/gemini-3.1-flash-live-preview
      - key: GEMINI_VOICE_NAME
        value: Zephyr
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: MEETING_BOT_NAME
        value: Manglara
      - key: MEETING_HEADLESS
        value: "true"
      - key: MEETING_MAX_DURATION_MIN
        value: "180"
      - key: MEETING_AVATAR_URL
        value: /meeting/avatar
      # URL pública de la web app (el bot abre ahí /meeting/avatar como cámara).
      - key: MEETING_WEB_URL
        sync: false
